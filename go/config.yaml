# 投资研判技能配置
# 修改以下配置项以适配你的基金/投资机构
# 修改后无需重启，下次执行自动读取

fund_name: "你的基金/投资公司名称"         # 报告标题和落款中的公司名称
recipient: "主送单位名称"                   # 报告主送单位（如"XX街道"）
sms_addressee: "董事长"                     # 领导简报短信中的称呼
local_district: "所在区/县"                 # 产业匹配度分析的属地
deliverables_dir: "~/deliverables"          # 输出文件保存目录
